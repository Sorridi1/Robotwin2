name: duco-real-pointcloud

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [1024, 6]
      type: point_cloud
      horizon: ${n_obs_steps}
    agent_pos:
      shape: [7]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [7]
    horizon: ${horizon}

env_runner:
  _target_: maniflow.env_runner.robot_runner.RobotRunner
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  task_name: ${task_name}

dataset:
  _target_: maniflow.dataset.robotwin_dataset.RoboTwinDataset
  # Override this on the command line with task.dataset.zarr_path=/absolute/path/data.zarr
  zarr_path: null
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 0
  val_ratio: 0.1
  max_train_episodes: null

  use_pc_color: ${policy.use_pc_color}
  pointcloud_color_aug_cfg:
    aug_color: true
    prob: 0.2
    params: [0.3, 0.4, 0.5, 0.08]
